[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nblaunch"
version = "0.1.0"
description = "JupyterHub service that validates launch signatures and opens notebooks from NBGallery."
requires-python = ">=3.11"
dependencies = [
  "jupyterhub>=4.0",
  "requests>=2.31",
  "tornado>=6.3",
]

[tool.setuptools]
py-modules = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
]

# Ruff lint rules to enable (error, bug, import-order, and pyupgrade checks).
[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
exclude = [
  "**/__pycache__",
  ".venv",
  "venv",
]
